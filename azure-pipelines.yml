# ASP.NET
# Build and test ASP.NET projects.
# Add steps that publish symbols, save build artifacts, deploy, and more:
# https://docs.microsoft.com/azure/devops/pipelines/apps/aspnet/build-aspnet-4

name: 2.2.0$(Rev:.r)

trigger:
- master

pr:
- master
- releases/*

pool:
  name: Default

variables:
  solution: 'example\jquery.dynamiclist.sln'
  buildPlatform: 'Any CPU'
  buildConfiguration: 'Release'
  projectSource: './src'

steps:
- task: NuGetToolInstaller@1

- task: NuGetCommand@2
  inputs:
    restoreSolution: '$(solution)'

- task: UseNode@1
  inputs:
    version: '22.x'

- task: Npm@1
  displayName: npm install
  inputs:
    command: 'install'
    workingDir: '$(projectSource)'

- task: Npm@1
  displayName: npm install -g gulp-cli
  inputs:
    command: 'custom'
    customCommand: 'install -g gulp-cli'

- task: Npm@1
  displayName: npm build
  inputs:
    command: 'custom'
    workingDir: '$(projectSource)'
    customCommand: 'run build'

- task: Npm@1
  displayName: npm install
  inputs:
    command: 'install'
    workingDir: 'example\jquery.dynamiclist.web'

- task: VSBuild@1
  inputs:
    solution: '$(solution)'
    vsVersion: 'latest'
    msbuildArgs: '/p:VisualStudioVersion=18.0 /p:DeployOnBuild=true /p:WebPublishMethod=Package /p:PackageAsSingleFile=true /p:SkipInvalidConfigurations=true /p:PackageLocation="$(build.artifactStagingDirectory)"'
    platform: '$(buildPlatform)'
    configuration: '$(buildConfiguration)'

- task: PublishBuildArtifacts@1
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)'
    ArtifactName: 'drop'
    publishLocation: 'Container'
