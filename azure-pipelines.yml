name: 2.2.0$(Rev:.r)

trigger:
- master

pr:
- master
- releases/*

pool:
  name: Default

variables:
  solution: 'example\jquery.dynamiclist.sln'
  webProject: 'example\jquery.dynamiclist.web\jquery.dynamiclist.web.csproj'
  buildConfiguration: 'Release'

steps:
- task: UseDotNet@2
  displayName: Install .NET 10 SDK
  inputs:
    packageType: sdk
    version: '10.x'

- task: UseNode@1
  displayName: Install Node.js 24
  inputs:
    version: '24.x'

- script: npm ci
  displayName: Restore npm dependencies
  workingDirectory: '$(Build.SourcesDirectory)'

- script: npm run build
  displayName: Build JavaScript assets
  workingDirectory: '$(Build.SourcesDirectory)'

- task: DotNetCoreCLI@2
  displayName: Build solution
  inputs:
    command: build
    projects: '$(solution)'
    arguments: '--configuration $(buildConfiguration)'

- task: DotNetCoreCLI@2
  displayName: Publish ASP.NET Core web app
  inputs:
    command: publish
    publishWebProjects: false
    projects: '$(webProject)'
    arguments: '--configuration $(buildConfiguration) --no-build --no-restore --output $(Build.ArtifactStagingDirectory)\web'
    zipAfterPublish: true

- task: PublishBuildArtifacts@1
  displayName: Publish build artifacts
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)'
    ArtifactName: 'drop'
    publishLocation: 'Container'
